# THE MONTE-CARLO CALIBRATION – IN FRONT OF EVERY PULL REQUEST SINCE 22.08 (owner's ruling).
#
# ⚠⚠ THE PARAGRAPHS BELOW ARGUED THE OPPOSITE AND THEY ARE KEPT, re-aimed rather than deleted,
# because the reasons the line moved matter as much as the line:
#
#   1. The failure mode that justified the exclusion is GONE. The red-on-green stories below -
#      birpc's 60s wall, exit 1 with every assertion passing - predate the P6 wave, since which
#      `npm run test:sim` runs serialised and exits 0 on green. The same command has run weekly on
#      this very runner without a wall since.
#   2. The "working rule" (touch the model -> run the bench yourself, numbers in the PR) FAILED
#      TWICE IN ONE WEEK, measured by the 22.08 bisect: faa5a6c (the rivals' fifth skill) and
#      41ce43a (the domestic season table) both reshaped careers, neither author ran test:sim, and
#      fatigue-bench-planner sat red for 8 days / ~200 commits - SEEN on day one (the 13.08
#      postscript below records exactly that sighting) and then lost, because the weekly run's
#      reader loop is nobody. A red X beside the merge button is a reader loop that exists.
#   3. The cost is ~5-6 min of ubuntu runner per PR and zero local minutes; timeout-minutes bounds
#      a hang, and the concurrency group cancels superseded runs on force-push.
#
# The weekly cron stays as the merge-skew backstop; workflow_dispatch stays for on-demand runs.
# The distinction the postscript draws - a REGRESSION test never lives here just because it is
# slow - stands unchanged.
#
# =================================================================================================
# ⚠ AS ORIGINALLY ARGUED (pre-22.08), kept as the record of a doctrine and why it held as long as
# it did:
#
# THE MONTE-CARLO CALIBRATION, DELIBERATELY OUT OF THE PR GATE.
#
# Three files - tests/econ-bench, tests/fatigue-bench, tests/match/calibration - are 143s of CPU
# and they are not regression tests. Every one of them says so in its own header: they are
# DETERMINISTIC statistical sweeps (10k-50k simulated matches, 30-seed career replays). They do not
# catch a flake; they catch a CHANGED MODEL. And you change the match model or the bench perhaps
# once a wave, on purpose, and when you do you run the bench and read the table - which is the
# whole point of owning a bench.
#
# WHAT THEY COST WHILE THEY LIVED IN THE GATE: three separate "generous file-level timeout"
# workarounds written into the files themselves, a `singleFork` hack in vite.config.ts, and two red
# builds in two days - both of them with every assertion passing and vitest's own reporter RPC
# timing out (`Timeout calling "onTaskUpdate"`, birpc's hard-coded 60s, which nothing in vitest's
# config can raise). A gate that fails for reasons unrelated to the code teaches people to ignore
# the gate, which is worse than not having one.
#
# SO THEY STILL RUN, JUST NOT IN FRONT OF A PULL REQUEST: weekly, and on demand from the Actions
# tab. Rot gets caught within a week rather than never. And the working rule, which is the real
# guard: TOUCH THE MATCH MODEL OR A BENCH TOOL -> run `npm run test:sim` yourself and put the
# numbers in the PR. That is how every balance change in this project has actually been reviewed.
#
# =================================================================================================
# ⚠ WHAT THE LINE IS ACTUALLY DRAWN ON, WRITTEN DOWN 13.08 BECAUSE IT HAD DRIFTED.
#
# The exclusion above is about MONTE-CARLO SWEEPS - deterministic statistical calibration - and not
# about "files that simulate careers". The sim project had quietly become the second thing: three
# more files arrived by splitting the original three, and `tests/endings-bench.test.ts` arrived
# because it drives careers, even though its own header says it is the opposite kind of file
# ("the smallest slice that can still catch the three things a refactor could silently break... it
# asserts BEHAVIOUR, not the printed numbers"). vite.config.ts recorded that it was placed there for
# SERIALISATION, not for cost. Nobody priced what that placement cost, and here it is:
#
#     "Rot gets caught within a week rather than never" only holds if somebody READS the weekly run.
#     Timing all eleven files on 13.08 turned up THREE pre-existing failures, none of them noticed:
#       endings-bench          red - its fork test threw on round-17's college precondition
#       fatigue-bench-planner  red - the doctor-veto direction check, 72 against 75
#       fatigue-bench-policy   64.1 s, two tests GREEN, exit 1 - birpc's wall, on a quiet 10-core
#                              Mac, alone in its own process, with nothing left to shard
#
# One is luck. Three is a feedback loop that nobody is in. So a regression test does NOT get to live
# here just because it is slow: endings-bench moved to HEAVY_UNIT_FILES and now gates every pull
# request in a process of its own (12.2 s solo; scripts/units.mjs carries the whole table).
#
# ⚠ AND THE THREE FILES NAMED ABOVE STAY OUT, INCLUDING THE CHEAP ONE. econ-bench is 39.0 s and
# fatigue-bench 29.4 s, but match/calibration is only 14.9 s today - cheaper than several files that
# are staying, and cheap enough that a cost-only rule would readmit it. It is still 10k simulated
# matches judged against hold-rate bands, which is the definition of the thing this file exists to
# keep out. Cost is the second test, never the first.
#
# ⚠ AND MEASURE BEFORE YOU MOVE ANYTHING. Every runtime quoted in vite.config.ts and in these files'
# own headers was measured months ago and every single one is now an UNDER-estimate (econ-reach-pro
# 21.8 -> 41.9, fatigue-bench-planner 7.4 -> 22.3). The suite gets dearer every wave; a stale number
# is how a file ends up over the wall without anybody deciding it should be.
name: Simulation calibration

on:
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC - the merge-skew backstop
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sim
