# ⚠⚠ 07.09 – THE WEEKLY RUN HAD BEEN RED SINCE 17.08 AND NOBODY KNEW, INCLUDING THE PART OF THIS
# FILE WHOSE ONE JOB IS TO MAKE SURE SOMEBODY KNOWS. Read off the run history, not inferred:
#
#     #7  07.09  23m29s  red   test:sim   audit SKIPPED   issue step 403
#     #6  31.08  16m13s  red   test:sim   audit SKIPPED   issue step 403
#     #5  24.08  17m14s  red   test:sim   audit SKIPPED   issue step 403
#     #4  22.08  17m29s  red   test:sim   (the one-day pull_request experiment)
#     #3  17.08  13m27s  red   test:sim
#
# Six of the seven runs this workflow has ever had are red. Only #1 was ever green, at 4m24s.
#
# THREE SEPARATE FAULTS, and only one of them is about tennis:
#
#   1. THE ALARM COULD NEVER RING. `actions/github-script` needs `issues: write`, and this file
#      declared no `permissions:` block at all – so the job ran on the repository default, which is
#      read-only. Every red run since the step was added on 22.08 ended in a 403. The "reader loop
#      that exists" has filed exactly zero issues in its entire life: the mechanism built to stop
#      rot sitting unread WAS the rot sitting unread, for three weeks, and the owner found it by
#      reading the Actions tab himself – which is the job it was supposed to take off him.
#   2. `npm audit` HAS NEVER RUN ONCE. It sat behind `test:sim` in the same job, so a red sim
#      skipped it every single week. It is red right now: nanoid <3.3.18, high, and genuinely in the
#      PRODUCTION tree (vue -> @vue/compiler-sfc -> postcss -> nanoid), so `--omit=dev` does not
#      excuse it. Dependency health is its own job below and can never be shadowed by the sim again.
#   3. THE SIM ITSELF went red on econ-bench: 11 tests of 11 GREEN, exit 1, `Timeout calling
#      "onTaskUpdate"` at 90.55 s. That is birpc's 60 s ceiling – the exact shape scripts/sim.mjs
#      was written to classify. It retried once, per doctrine, and stalled again.
#
# ⭐ THE LESSON IS ABOUT SHAPE, NOT ABOUT PERMISSIONS. Every one of the three is the same failure:
# a step that reports on other steps was placed WHERE THOSE STEPS COULD SILENCE IT. Fixing the 403
# alone would have left the audit shadowed; fixing the audit alone would have left the alarm mute.
# So the run is now four jobs that cannot silence one another, and the reporter is downstream of
# all of them.
#
# WHAT THE MATRIX BUYS, AND WHAT IT DOES NOT (owner's call, 07.09 – «по третьему давай матрицу»).
# BUYS: 23 minutes of wall clock become the slowest single file plus its install; a red file is
# NAMED in the run list instead of buried in a 23-minute log; `fail-fast: false` means one dead file
# no longer hides the twelve behind it; and the Issue can now say WHICH file went red. It costs
# nothing that is metered – this repository is public, so Actions minutes are free, and the trade is
# ~13 npm installs of billed time against a fifth of the wall clock.
# ⚠ DOES NOT BUY a cure for the birpc wall, and this file must not pretend otherwise.
# `scripts/sim.mjs` ALREADY spawns one vitest per file, so there was never contention BETWEEN sim
# files for the matrix to remove. If econ-bench crosses the 60 s ceiling on its own merits it will
# stall on a fresh runner too, and the retry-once classifier remains the only thing standing between
# that and a false red. Whether the stall is intrinsic or co-tenancy is the NEXT measurement.
#
# ⚠ AND THE FILE LIST IS NOT WRITTEN HERE. The matrix is generated from scripts/heavy-tests.mjs at
# run time, because a list hand-copied into YAML would be the third copy of exactly the list whose
# second copy scripts/heavy-tests.mjs was created to abolish.
#
# =================================================================================================
# THE MONTE-CARLO CALIBRATION – WEEKLY AND ON DEMAND, NEVER IN FRONT OF A PULL REQUEST.
#
# ⚠⚠ FINAL RULING (owner, 22.08) – DO NOT REVISIT WITHOUT NEW EVIDENCE. The pull_request trigger
# was tried for exactly one day, on the owner's own approval, and the runner measured it out:
# ~330s of serialised sim on a 10-core M-series Mac becomes 20+ minutes on a 2-core ubuntu runner,
# which brushed the job's own 25-minute ceiling – «неистовое количество времени» and a red X that
# was the timeout, not the tennis. The owner: «до этого мы договорились делать её оффлайн сами и
# не тащить на гит… добавить пометку в документацию об этом, чтобы мы в будущем не возвращались к
# этому вопросу, но при этом запускали её регулярно и знали, что она нормально работает.»
#
# So the standing regime, all three parts load-bearing:
#   1. WEEKLY cron + workflow_dispatch, timeout sized for the slow runner (60), never on a PR;
#   2. ⭐ A RED WEEKLY RUN FILES AN ISSUE by itself (the failure step below) – this is the piece
#      that was always missing: rot sat unread for 8 days in August because "the weekly run's
#      reader loop is nobody"; an Issue lands where the owner already looks;
#   3. THE WORKING RULE, in CLAUDE.md: touch the match model or a bench tool -> run
#      `npm run test:sim` YOURSELF, locally, and put the numbers in the PR body.
#
# =================================================================================================
# The one-day experiment's own reasoning, kept as the record of why it was tried:
#
# THE MONTE-CARLO CALIBRATION – IN FRONT OF EVERY PULL REQUEST SINCE 22.08 (owner's ruling).
#
# ⚠⚠ THE PARAGRAPHS BELOW ARGUED THE OPPOSITE AND THEY ARE KEPT, re-aimed rather than deleted,
# because the reasons the line moved matter as much as the line:
#
#   1. The failure mode that justified the exclusion is GONE. The red-on-green stories below -
#      birpc's 60s wall, exit 1 with every assertion passing - predate the P6 wave, since which
#      `npm run test:sim` runs serialised and exits 0 on green. The same command has run weekly on
#      this very runner without a wall since.
#   2. The "working rule" (touch the model -> run the bench yourself, numbers in the PR) FAILED
#      TWICE IN ONE WEEK, measured by the 22.08 bisect: faa5a6c (the rivals' fifth skill) and
#      41ce43a (the domestic season table) both reshaped careers, neither author ran test:sim, and
#      fatigue-bench-planner sat red for 8 days / ~200 commits - SEEN on day one (the 13.08
#      postscript below records exactly that sighting) and then lost, because the weekly run's
#      reader loop is nobody. A red X beside the merge button is a reader loop that exists.
#   3. The cost is ~5-6 min of ubuntu runner per PR and zero local minutes; timeout-minutes bounds
#      a hang, and the concurrency group cancels superseded runs on force-push.
#
# The weekly cron stays as the merge-skew backstop; workflow_dispatch stays for on-demand runs.
# The distinction the postscript draws - a REGRESSION test never lives here just because it is
# slow - stands unchanged.
#
# =================================================================================================
# ⚠ AS ORIGINALLY ARGUED (pre-22.08), kept as the record of a doctrine and why it held as long as
# it did:
#
# THE MONTE-CARLO CALIBRATION, DELIBERATELY OUT OF THE PR GATE.
#
# Three files - tests/econ-bench, tests/fatigue-bench, tests/match/calibration - are 143s of CPU
# and they are not regression tests. Every one of them says so in its own header: they are
# DETERMINISTIC statistical sweeps (10k-50k simulated matches, 30-seed career replays). They do not
# catch a flake; they catch a CHANGED MODEL. And you change the match model or the bench perhaps
# once a wave, on purpose, and when you do you run the bench and read the table - which is the
# whole point of owning a bench.
#
# WHAT THEY COST WHILE THEY LIVED IN THE GATE: three separate "generous file-level timeout"
# workarounds written into the files themselves, a `singleFork` hack in vite.config.ts, and two red
# builds in two days - both of them with every assertion passing and vitest's own reporter RPC
# timing out (`Timeout calling "onTaskUpdate"`, birpc's hard-coded 60s, which nothing in vitest's
# config can raise). A gate that fails for reasons unrelated to the code teaches people to ignore
# the gate, which is worse than not having one.
#
# SO THEY STILL RUN, JUST NOT IN FRONT OF A PULL REQUEST: weekly, and on demand from the Actions
# tab. Rot gets caught within a week rather than never. And the working rule, which is the real
# guard: TOUCH THE MATCH MODEL OR A BENCH TOOL -> run `npm run test:sim` yourself and put the
# numbers in the PR. That is how every balance change in this project has actually been reviewed.
#
# =================================================================================================
# ⚠ WHAT THE LINE IS ACTUALLY DRAWN ON, WRITTEN DOWN 13.08 BECAUSE IT HAD DRIFTED.
#
# The exclusion above is about MONTE-CARLO SWEEPS - deterministic statistical calibration - and not
# about "files that simulate careers". The sim project had quietly become the second thing: three
# more files arrived by splitting the original three, and `tests/endings-bench.test.ts` arrived
# because it drives careers, even though its own header says it is the opposite kind of file
# ("the smallest slice that can still catch the three things a refactor could silently break... it
# asserts BEHAVIOUR, not the printed numbers"). vite.config.ts recorded that it was placed there for
# SERIALISATION, not for cost. Nobody priced what that placement cost, and here it is:
#
#     "Rot gets caught within a week rather than never" only holds if somebody READS the weekly run.
#     Timing all eleven files on 13.08 turned up THREE pre-existing failures, none of them noticed:
#       endings-bench          red - its fork test threw on round-17's college precondition
#       fatigue-bench-planner  red - the doctor-veto direction check, 72 against 75
#       fatigue-bench-policy   64.1 s, two tests GREEN, exit 1 - birpc's wall, on a quiet 10-core
#                              Mac, alone in its own process, with nothing left to shard
#
# One is luck. Three is a feedback loop that nobody is in. So a regression test does NOT get to live
# here just because it is slow: endings-bench moved to HEAVY_UNIT_FILES and now gates every pull
# request in a process of its own (12.2 s solo; scripts/units.mjs carries the whole table).
#
# ⚠ AND THE THREE FILES NAMED ABOVE STAY OUT, INCLUDING THE CHEAP ONE. econ-bench is 39.0 s and
# fatigue-bench 29.4 s, but match/calibration is only 14.9 s today - cheaper than several files that
# are staying, and cheap enough that a cost-only rule would readmit it. It is still 10k simulated
# matches judged against hold-rate bands, which is the definition of the thing this file exists to
# keep out. Cost is the second test, never the first.
#
# ⚠ AND MEASURE BEFORE YOU MOVE ANYTHING. Every runtime quoted in vite.config.ts and in these files'
# own headers was measured months ago and every single one is now an UNDER-estimate (econ-reach-pro
# 21.8 -> 41.9, fatigue-bench-planner 7.4 -> 22.3). The suite gets dearer every wave; a stale number
# is how a file ends up over the wall without anybody deciding it should be.
name: Simulation calibration

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch:

# Read-only by default; the one job that writes says so itself, next to the write.
permissions:
  contents: read

jobs:
  # The matrix's own source of truth, imported rather than copied. See the header.
  list:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.read.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: read
        run: |
          FILES=$(node -e "import('./scripts/heavy-tests.mjs').then(m => process.stdout.write(JSON.stringify(m.HEAVY_SIM_FILES)))")
          echo "read ${FILES}"
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

  sim:
    needs: list
    runs-on: ubuntu-latest
    # One file, not thirteen: sized for the slowest of them on a 2-core runner, plus its install.
    timeout-minutes: 20
    strategy:
      # A dead file must not hide the twelve behind it – that is half of what the matrix is for.
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.list.outputs.files) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Through scripts/sim.mjs, never straight at vitest: the stall classifier and its ONE retry
      # live in that script, and a matrix that called vitest directly would lose both.
      # The value goes through the environment rather than into the command line – it comes from a
      # file in the repository, and interpolating repository text into a shell is a habit that only
      # has to be wrong once.
      - env:
          SIM_FILE: ${{ matrix.file }}
        run: npm run test:sim -- "$SIM_FILE"

  # Its own job since 07.09. It spent three weeks behind a red sim in the same job and never ran.
  # Weekly, not on PRs, where it would flake on registry weather. High and above only; a dev-only
  # advisory does not reach a player.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # ⭐ THE READER LOOP, DOWNSTREAM OF EVERYTHING IT REPORTS ON so that nothing it reports on can
  # silence it. `always()` because a failed `needs` would otherwise skip this job outright.
  report:
    needs: [list, sim, audit]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # the 403 that hid five red runs: this line was missing
      actions: read # to name the jobs that failed
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly simulation calibration is RED'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            })
            // Name the red jobs. Before the matrix an Issue could only say "something in a
            // 23-minute log"; now it says which file, which is the difference between a reader
            // loop and a notification.
            const red = jobs.filter((j) => j.conclusion === 'failure').map((j) => `- \`${j.name}\``)
            const which = red.length ? `\n\nRed:\n${red.join('\n')}` : ''
            const body = `The weekly calibration failed.${which}\n\nRun: ${runUrl}\n\nThe working rule stands: every PR assembly runs \`npm run test:sim\` locally and brings the numbers.`
            // The label did not exist in the repository on 07.09, and BOTH halves below lean on
            // it – the dedupe query and the create call. Whether `issues.create` conjures a missing
            // label is folklore either way, so make it, and let an already-exists 422 pass.
            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: 'sim-health',
                color: 'b60205',
                description: 'The weekly simulation calibration is red',
              })
            } catch (err) {
              if (err.status !== 422) throw err
            }
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'sim-health' })
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['sim-health'] })
            }
