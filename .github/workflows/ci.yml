name: CI (pull requests)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# A superseded run on the same PR is dead weight - cancel it, keep the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠ THE CHECKLIST IS A CONTRACT, NOT DECORATION (owner, 22.08: «Как нам сделать, чтобы они
  # проверялись и работали?»). This job fails while ANY box in the PR body is unticked, so the
  # template's four attestations gate the merge exactly like a test does. Two of the four are
  # ALSO machine-proven regardless of the tick (tests green + check green = the jobs below;
  # engine purity = its own step below); the tick remains the author's signature that the
  # human-only halves - the linked Issue, «tests added or UPDATED» - are true.
  # `types: [edited]` above is what re-runs this the moment a box is ticked in the web UI.
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || ''
            const unchecked = body.match(/^\s*[-*] \[ \] .+$/gm) || []
            if (unchecked.length) {
              core.setFailed(`PR checklist: ${unchecked.length} box(es) unticked:\n` + unchecked.join('\n'))
            } else {
              console.log('PR checklist: every box ticked')
            }
  test-build:
    runs-on: ubuntu-latest
    # ⚠⚠ A HUNG JOB MUST DIE, NOT BURN THE AFTERNOON (19.08). Neither job carried a timeout, so
    # GitHub's default applied - SIX HOURS - and a run that wedged simply sat there "in progress",
    # telling nobody anything and holding a runner. The owner saw exactly that. A ceiling turns
    # "still running" into "failed at N minutes, here is the log", which is the difference between a
    # signal and a silence. Sized well above the honest worst case (the unit shards run ~4 min
    # locally, the e2e job spends ~2 of its own minutes fetching Chromium), so it can only ever fire
    # on a wedge and never on a slow-but-working run.
    #
    # ⚠ RAISED 25 -> 35 ON 26.08, AND THE CEILING HAD STOPPED MEANING WHAT ITS NOTE SAYS. The unit
    # shards it was sized against ran ~4 min locally; round 26's stall fix took them to 328 s - the
    # bulk pool went over birpc's wall, and the two files genuinely near it now get a process each
    # (scripts/heavy-tests.mjs carries the measurement, and the twelve-file first attempt that cost
    # the owner seven minutes of wall clock). 25 was no longer «well above the honest worst case» and
    # would have started firing on slow-but-working runs, which is the one thing this note says it
    # must never do. ⚠ IT IS NOT A FIX FOR A STALL: a wedged pass burns whatever ceiling it is given,
    # and the fix for that is upstream, in the sharding and ultimately in the files themselves.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ⚠ THE CONTEXT AUDIT, AND IT WAS MISSING FROM THIS GATE (round-22 review). `npm run check`
      # – the pre-push gate – has run it first since it was written, so a required context file
      # deleted, a doc given an unknown status, or a recurring budget blown fails locally and
      # passed here. Same class of hole as the art and legal gates: nothing breaks a build, so it
      # ships silently. It goes FIRST for the same reason `check` puts it first – it is a few
      # seconds of pure file reading, and a gate should fail on its cheapest step.
      - run: npm run context:audit
      # Invariant 1, machine-enforced: src/engine|worker|db|shared import no vue/pinia. Seconds of
      # file reading; the PR template's third checkbox states what this step has already proven.
      # The volatile facts a machine can source (R2-04): the schema number and the live wave. Both
      # rotted repeatedly in hand-maintained context packs; seconds of file reading now owns them.
      - run: node scripts/doc-facts.mjs
      - run: node scripts/engine-purity.mjs
      # ⭐⭐ THE SHELF-LIFE CHECK (round 30 item 25, 30.08). Fails when this branch's
      # SAVE_SCHEMA_VERSION equals main's AND the migration step for that version differs from
      # main's – the signature of a step amended after its version shipped, which makes migrateSave
      # skip it for ever on every save already in play. One save was corrupted this way before the
      # check existed.
      #
      # ⚠⚠ THE FETCH IS THE CHECK. `actions/checkout` is shallow and leaves no `origin/main`, and –
      # more to the point – a check that reads a STALE origin/main gives the same wrong answer, from
      # the same expired fact, that produced the bug. That is exactly why this cannot live in the
      # unit suite: `npm run check` is offline and deterministic and must stay that way, so the
      # comparison runs here, where the network already is and where a PR is being assembled –
      # «the moment you bump». `--require` makes a missing ref a failure rather than a skip.
      - run: git fetch --depth=1 origin main
      - run: node scripts/schema-ladder.mjs --require
      # ⚠ THE GENERATED SYMBOL MAP, AND THE CHECK IS THE WHOLE POINT OF GENERATING IT (TOK-4).
      # `tools/generated/world-symbol-map.md` says which module DECLARES each of the 233 names the
      # `engine/world` barrel re-exports - the question 277 importers cannot otherwise answer
      # without opening a 3,600-line file. A generated index nobody verifies is just a document
      # that goes stale, so this fails the PR that moves a symbol without regenerating. It reads
      # source text and runs in about a second; the fix is one command, named in the failure.
      - run: node scripts/world-map.mjs --check
      # ⚠ WHICH TOOLS ARE LIVE, AND THE ASSERTION THAT MATTERS IS THE SECOND ONE. The registry
      # rewrites `tools/README.md` from the tree and checks that `tsconfig.app.json`'s `tools/`
      # entries are exactly the live set; without it the two lists drift and the build quietly grows
      # back to every file in the directory. Sub-second of file reading.
      - run: npm run tools:registry:check
      # --force: vue-tsc -b trusts its incremental cache, which has hidden real type errors
      # (a duplicate-import TS2300 shipped past a cached build on 25.07). Full check, always.
      - run: npx vue-tsc -b --force
      # ⚠⚠ THE ARCHIVAL HALF OF `tools/`, WHICH `vue-tsc -b` ABOVE DOES NOT SEE (P-01, 02.09).
      # `tsconfig.tools.json` is deliberately outside the root project graph, and until now it was
      # invoked from `package.json` and from nowhere else - so nothing ever ran it. The 02.09 review
      # found it red with nine errors across six tools, one of them written the day before. An
      # archival probe is evidence, and evidence that no longer compiles cannot be re-run.
      # Measured at 4.2 s locally; it is a typecheck, so it sits beside the one above.
      - run: npm run check:tools
      # ⚠ THE GATE RUNS THE `unit` PROJECT. The Monte-Carlo files are NOT in it and that is a
      # decision, not an omission - see .github/workflows/simulation.yml and the note in
      # vite.config.ts. They are deterministic statistical calibration, they cost 143s of CPU, and
      # they have been losing a fight with vitest's reporter RPC for months.
      # ⚠⚠ `npm test` LEFT THIS JOB ON 30.08 AND THE REASON IS A MEASUREMENT, NOT A PREFERENCE.
      # His Actions log: the whole gate 18m32s, of which `npm test` was 15m08s - `bulk` 501 s and
      # then eleven heavy files strictly serially for 406 s (the sum, to the second). A heavy file
      # is a process of its own, so for 406 s of every run half this runner idled by construction.
      # `npm ci` measured at 6 s, so a job of its own costs six seconds of billing and returns
      # minutes of wall clock. The two halves now run as `unit-bulk` and `unit-heavy` below.
      # ⚠ NOT parallelised INSIDE a job: separate processes exist because of birpc's stall under
      # contention (scripts/units.mjs' own header), and crowding them onto two cores re-creates the
      # defect they were carved out of. Different runners, not more threads on one.
      # The mounted-component project (P9). Seconds of runtime, and it is the ONLY gate that
      # catches a UI regression: every other component test in this repo reads source text.
      - run: npm run test:component
      - run: npm run build

  # ⭐ THE LONG POLE, ALONE. 501 s of pooled files - the one block worth its own runner.
  unit-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/units.mjs --only=bulk --verbose

  # ⭐ THE ELEVEN THAT USED TO WAIT THEIR TURN. Still one process each, still serial WITHIN the job -
  # that is the birpc rule and it does not bend - but no longer queued behind `bulk` on one runner.
  unit-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/units.mjs --only=heavy --verbose

  # THE E2E SUITE – ALL OF IT, IN ONE BROWSER (S0–S2 of docs/plans/playwright.md).
  #
  # ⚠⚠ THE NAME AND THIS COMMENT USED TO SAY «SMOKE, AND ONLY THE SMOKE … ONE SPEC», AND THE STEP
  # BELOW HAS ALWAYS RUN THE UNFILTERED SUITE (QA-37 of the 02.09 review). Two things were wrong at
  # once: the label described work the job does not do, and the block describing it had drifted up
  # the file onto `unit-bulk`. Corrected by moving the LABEL to the work, not the work to the label,
  # and the reason is a measurement plus a standing owner priority:
  #   THE COST IS THE BROWSER, NOT THE SUITE. The step below it fetches ~273 MiB of Chromium and
  #     spends ~2 minutes doing it. The suite itself measured 31 tests in 13 files, 17 s of test time
  #     (02.09), against this job's 20-minute ceiling. Filtering to one spec would save seconds off a
  #     job whose cost is dominated by a download that both arms pay in full.
  #   NARROWING WOULD DELETE LIVE COVERAGE. Those 31 tests are green on every PR today. «Restore an
  #     intentional smoke selection» reads as a cleanup and lands as a coverage cut.
  #   ⭐ AND IT WOULD CONTRADICT A STANDING CALL. «Grow the e2e suite, and keep growing it» is the
  #     owner's own of 29.08 (docs/now-next-later.md, Next). A gate pinned to one spec while the
  #     suite grows is the exact defect P-01 exists to remove: a gate nobody runs.
  #
  # WHAT STAYS DELIBERATELY NARROW – and this half of the old note was never a lie:
  #   ONE BROWSER - chromium. Firefox and WebKit are several hundred MiB more of download for the
  #                 same assertions. The full device matrix, visual regression and a11y belong to S3,
  #                 in a nightly workflow of their own. Do not grow THIS job into that: a PR gate
  #                 that spends minutes driving three browsers is the Monte-Carlo story a second
  #                 time, and it ends the same way (simulation.yml's header tells that story).
  #   ONE RETRY   - and a spec that NEEDS it gets fixed, not tolerated (playwright.config.ts).
  #
  # A SEPARATE JOB RATHER THAN TWO MORE STEPS ON `test-build`: it runs alongside the typecheck and
  # the unit suite instead of stacking onto them, so it costs a PR roughly nothing in wall clock -
  # and a red `e2e` names what broke without anyone reading a log to find out.
  #
  # ⚠ RENAMED FROM `e2e-smoke` ON 02.09. If branch protection lists a required status check by the
  # old name, update it – a required check that no job reports blocks the merge queue silently.
  e2e:
    runs-on: ubuntu-latest
    # See `test-build`'s note: a wedge has to report, not hold a runner until the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ⚠ THE BROWSER IS NOT AN NPM DEPENDENCY. `npm ci` installs the harness; this fetches the
      # ~273 MiB of Chromium it drives, plus the system libraries a headless browser needs on a bare
      # runner (`--with-deps`). Deliberately NOT cached: a GitHub cache entry of that size restores
      # at about the speed the CDN serves it, and it would share - and evict - the same 10 GB quota
      # the npm cache above is already using, which would slow every other job to speed up this one.
      - run: npx playwright install --with-deps chromium
      # No build step: playwright.config.ts's webServer runs `vite build` and serves the result with
      # `vite preview`, so the suite always tests the artefact a player gets rather than a dev server
      # - and can never test a dist someone else's step happened to leave behind.
      - run: npm run test:e2e
      # ⚠ ON FAILURE ONLY, WHICH IS THE ONLY TIME THE REPORT IS OPENED. It carries the trace and the
      # video the config records on the first retry - a clickable recording of what the browser
      # actually did, which is the whole reason to keep a report at all. A green run's report is
      # noise, and artifact storage is not free.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
