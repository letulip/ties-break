# GitLab CI – a PARTIAL mirror of the GitHub workflows (ci.yml + deploy.yml). «Partial» is the
# correction: this header said «mirrors … same gates as GitHub» while the `test` job below ran four
# commands against ci.yml's ten gate steps plus three jobs of its own (T-10 of the 05.09 review).
# What it skips is now listed rather than implied.
# Why GitLab: GitHub Pages needs a paid plan to publish from a PRIVATE repo; GitLab Pages does it
# on the free tier, and its Pages access control can keep the code private while the site is public.
#
# Two jobs:
#   test  – every branch / MR: forced typecheck + unit suite + component suite + build
#   pages – main only: the same four, then publish
#
# ⚠ WHAT THIS FILE DOES NOT RUN. Against .github/workflows/ci.yml, both jobs below are missing:
#   * five of the doc gates ci.yml runs first – context:audit, doc-facts, engine-purity,
#     map:world:check, tools:registry:check;
#   * `npm run check:tools`, the archival half of tools/ (ci.yml's own note calls it evidence that
#     has to keep compiling), and `node scripts/install-size.mjs`, the PWA install ceiling;
#   * `scripts/schema-ladder.mjs --require`, which needs a fetched origin/main and so is CI-only
#     by design;
#   * the PR-checklist job, which has no GitLab equivalent;
#   * the `e2e` job and the weekly Monte-Carlo calibration – those two are DECISIONS, argued below.
# (`pins:check` and `decisions:check` are in neither CI file; they run in `npm run check` only.)
# Everything but the last bullet is drift, not a decision. The one-line repair, if GitLab ever
# becomes a remote anyone gates on, is to run `npm run check` here instead of four hand-copied
# commands – it is the gate the owner runs before a push and it cannot drift from itself. Not done
# today because the working rule is «push to origin (GitHub) only» and the two `main`s have
# diverged, so a fuller gate here would burn metered minutes on a branch nobody merges from.
#
# --force on vue-tsc: `-b` trusts its incremental cache, which has hidden real type errors before
# (a duplicate-import TS2300 shipped past a cached build on 25.07). Always a full check.
#
# ⚠ SIMULATION CALIBRATION (`npm run test:sim`) IS GITHUB-ONLY, ON PURPOSE (P6 (d), 01.08).
# "Mirrors the GitHub workflows" above deliberately does NOT extend to the weekly Monte-Carlo
# calibration job (.github/workflows/simulation.yml, cron Mondays 04:00 UTC): the working rule for
# match-model changes is run-test:sim-locally-and-paste-the-numbers (see that workflow's header),
# GitLab's role here is PR-gate mirror + Pages, and a second scheduler would double the
# red-on-green surface while burning the quota minutes this repo counts, on a report nobody reads
# on this remote. If GitLab ever becomes the primary remote, port simulation.yml then - do not
# quietly add a sim job to `test`.
#
# ⚠ THE E2E JOB IS GITHUB-ONLY FOR THE SAME REASON (S0, 08.08; renamed from `e2e-smoke` 02.09 – it
# runs the whole suite and always did). .github/workflows/ci.yml gained an
# `e2e` job; this file deliberately does not mirror it. Every run of it downloads ~273 MiB of
# Chromium and boots a real browser, and GitLab's minutes are the metered ones - so mirroring would
# double the cost of the least-read gate on the less-used remote. The e2e layer's own reasoning
# (e2e/README.md) says the PR gate exists to be trusted, and one trustworthy gate on the remote
# people actually open pull requests against is worth more than two. If GitLab ever becomes the
# primary remote, port the job then - and port it whole, browser install included.

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - test
  - deploy

test:
  stage: test
  # These four are the whole gate on this remote – the header lists what that leaves out. ⚠ And
  # `npm run build` is `vue-tsc -b && vite build`, so the typecheck above runs twice here; ci.yml
  # and deploy.yml dropped the repeat on 05.09 (T-06) and this file deliberately was not touched in
  # the same pass, because nothing is pushed to GitLab and an untested edit to a gate nobody runs is
  # worth less than the second it saves.
  script:
    - npx vue-tsc -b --force
    - npm test
    - npm run test:component
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - npx vue-tsc -b --force
    - npm test
    - npm run test:component
    # BASE_PATH is derived from the real Pages URL, so this works BOTH ways:
    #   classic namespace URL  https://<user>.gitlab.io/ties-break  -> "/ties-break/"
    #   unique-domain URL      https://ties-break-abc123.gitlab.io  -> "/"
    # (GitLab enables unique domains for new projects; hardcoding /$CI_PROJECT_NAME/ would 404
    #  every asset in that case.)
    - export BASE_PATH="$(echo "$CI_PAGES_URL" | sed -E 's#https?://[^/]+##')/"
    - echo "Building with BASE_PATH=$BASE_PATH (CI_PAGES_URL=$CI_PAGES_URL)"
    - npm run build
    # GitLab Pages serves the `public/` directory. Vite READS public/ as its static-asset source
    # and writes to dist/, so the swap happens only AFTER the build, in this throwaway checkout.
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
