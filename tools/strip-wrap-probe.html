<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/style.css"></head>
<body>
<div id="host" style="width:1200px">
  <div class="season-strip" id="strip" style="flex-wrap:nowrap"></div>
</div>
<script>
window.render = function (cells) {
  const strip = document.getElementById('strip')
  strip.innerHTML = ''
  cells.forEach((c, i) => {
    let el
    if (c.gap) { el = document.createElement('button'); el.className = 'pill tier-chip strip-more'; el.textContent = '…'
      el.style.padding = '1px 10px'; el.style.minHeight = '0'; el.style.lineHeight = '1.5'
      el.style.border = '1px solid var(--line)'; el.style.borderRadius = 'var(--radius-pill)'
      el.style.background = 'transparent'; el.style.fontSize = '12px'; el.style.letterSpacing = '0.06em'
    } else { el = document.createElement('span'); el.className = 'pill tier-chip ' + c.state; el.textContent = c.text }
    strip.appendChild(el)
    if (i < cells.length - 1) { const a = document.createElement('span'); a.className = 'strip-arrow'; a.textContent = '→'; strip.appendChild(a) }
  })
  return [...strip.children].map((el) => +el.getBoundingClientRect().width.toFixed(2))
}
</script>
</body></html>
